name: release

# Push a tag like v0.0.1 to build and publish a GitHub Release with the
# Linux .so and Windows .dll attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvlccore-dev libcurl4-openssl-dev \
                                  vlc-bin vlc-plugin-base vlc-data
      - run: make
      - name: Smoke test
        run: |
          mkdir -p ~/jf/plugins/interface
          cp libjellyfin_plugin.so ~/jf/plugins/interface/
          CACHE_GEN="$(command -v vlc-cache-gen || true)"
          [ -n "$CACHE_GEN" ] || CACHE_GEN="$(echo /usr/lib/*/vlc/vlc-cache-gen)"
          "$CACHE_GEN" ~/jf/plugins
          VLC_PLUGIN_PATH=~/jf/plugins vlc -I dummy --list 2>/dev/null | grep -i jellyfin
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: libjellyfin_plugin.so
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-vlc
      - name: Build (curl statically linked, no runtime DLL deps)
        run: |
          # -Bstatic forces libcurl.a; without it -lcurl picks libcurl.dll.a
          make CURL_CFLAGS="-DCURL_STATICLIB" \
            CURL_LIBS="-Wl,-Bstatic -lcurl -lssl -lcrypto -lz -lzstd -lbrotlidec -lbrotlicommon -lssh2 -lnghttp2 -lnghttp3 -lngtcp2 -lngtcp2_crypto_ossl -Wl,-Bdynamic -lws2_32 -lcrypt32 -lwldap32 -lbcrypt -lnormaliz"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: libjellyfin_plugin.dll
          if-no-files-found: error

  windows-x86:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make p7zip curl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-vlc
            mingw-w64-i686-gcc
            mingw-w64-i686-curl
            mingw-w64-i686-binutils
            mingw-w64-i686-tools
      - name: Build 32-bit libvlccore import library
        run: |
          curl -sLO http://download.videolan.org/pub/videolan/vlc/3.0.21/win32/vlc-3.0.21-win32.7z
          7z x -y vlc-3.0.21-win32.7z vlc-3.0.21/libvlccore.dll > /dev/null
          cd vlc-3.0.21
          export PATH=/mingw32/bin:$PATH   # use i686 gendef/dlltool
          gendef libvlccore.dll
          dlltool -d libvlccore.def -m i386 -l libvlccore.dll.a
          ls -l libvlccore.dll.a
      - name: Build
        run: |
          export PATH=/mingw32/bin:$PATH
          make CC=i686-w64-mingw32-gcc PLUGIN=libjellyfin_plugin.dll \
            VLC_CFLAGS="-I/ucrt64/include -I/ucrt64/include/vlc/plugins -D__PLUGIN__ -D_FILE_OFFSET_BITS=64 -D_REENTRANT -D_THREAD_SAFE" \
            VLC_LIBS="$PWD/vlc-3.0.21/libvlccore.dll.a" \
            CURL_CFLAGS="-I/mingw32/include -DCURL_STATICLIB" CURL_LIBS="-L/mingw32/lib -Wl,-Bstatic -lcurl -lssl -lcrypto -lz -lzstd -lbrotlidec -lbrotlicommon -lssh2 -lnghttp2 -lnghttp3 -lngtcp2 -lngtcp2_crypto_ossl -Wl,-Bdynamic -lws2_32 -lcrypt32 -lwldap32 -lbcrypt -lnormaliz"
          file libjellyfin_plugin.dll || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: libjellyfin_plugin.dll
          if-no-files-found: error

  release:
    needs: [test, linux, windows, windows-x86]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage release files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          mv dist/linux-amd64/libjellyfin_plugin.so \
             "release/libjellyfin_plugin-linux-amd64-v${VERSION}.so"
          mv dist/windows-x64/libjellyfin_plugin.dll \
             "release/libjellyfin_plugin-windows-x64-v${VERSION}.dll"
          mv dist/windows-x86/libjellyfin_plugin.dll \
             "release/libjellyfin_plugin-windows-x86-v${VERSION}.dll"
          # Ready-to-use packages: unzip and drop the libjellyfin folder
          # straight into VLC's plugins/ directory - dll already correctly
          # named, no renaming needed.
          for plat in linux-amd64:so windows-x64:dll windows-x86:dll; do
            name="${plat%%:*}"; ext="${plat##*:}"
            mkdir -p pkg/libjellyfin
            cp "release/libjellyfin_plugin-${name}-v${VERSION}.${ext}" \
               "pkg/libjellyfin/libjellyfin_plugin.${ext}"
            cp packaging/install-readme.txt pkg/libjellyfin/
            (cd pkg && zip -r "../release/libjellyfin-${name}-v${VERSION}.zip" libjellyfin)
            rm -rf pkg/libjellyfin
          done
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          generate_notes: true
          files: release/*
