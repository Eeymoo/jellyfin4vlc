name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 主机端单元测试（不需要 VLC 头文件）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test

  # Linux: VLC 3.0 插件 (.so)
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # Debian 13+/Ubuntu 24.04 merged vlc-plugin-dev into libvlccore-dev;
          # vlc-bin provides the vlc binary + vlc-cache-gen for the smoke test
          sudo apt-get install -y pkg-config libvlccore-dev libcurl4-openssl-dev \
                                  vlc-bin vlc-plugin-base vlc-data
      - name: Build
        run: make
      - name: Smoke test (module registered in vlc --list)
        run: |
          set -x
          mkdir -p ~/jf/plugins/interface
          cp libjellyfin_plugin.so ~/jf/plugins/interface/
          CACHE_GEN="$(command -v vlc-cache-gen || true)"
          [ -n "$CACHE_GEN" ] || CACHE_GEN="$(echo /usr/lib/*/vlc/vlc-cache-gen)"
          "$CACHE_GEN" ~/jf/plugins
          VLC_PLUGIN_PATH=~/jf/plugins vlc -I dummy --list 2>/dev/null | grep -i jellyfin
      - uses: actions/upload-artifact@v4
        with:
          name: libjellyfin_plugin-linux-amd64
          path: libjellyfin_plugin.so
          if-no-files-found: error

  # Windows: VLC 3.0 插件 (.dll), MSYS2 UCRT64
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-vlc
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: libjellyfin_plugin-windows-x64
          path: libjellyfin_plugin.dll
          if-no-files-found: error

  # Windows 32-bit: for VLC installed under "Program Files (x86)".
  # MSYS2 has no i686 VLC package, so headers come from the ucrt64 vlc
  # package (arch-independent) and the libvlccore import library is
  # generated from the official VLC win32 build with gendef/dlltool.
  windows-x86:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make p7zip curl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-vlc
            mingw-w64-i686-gcc
            mingw-w64-i686-curl
            mingw-w64-i686-binutils
      - name: Build 32-bit libvlccore import library
        run: |
          curl -sLO http://download.videolan.org/pub/videolan/vlc/3.0.21/win32/vlc-3.0.21-win32.7z
          7z x -y vlc-3.0.21-win32.7z vlc-3.0.21/libvlccore.dll > /dev/null
          cd vlc-3.0.21
          gendef libvlccore.dll
          dlltool -d libvlccore.def -m i386 -l libvlccore.dll.a
          ls -l libvlccore.dll.a
      - name: Build
        run: |
          export PATH=/mingw32/bin:$PATH
          make CC=i686-w64-mingw32-gcc PLUGIN=libjellyfin_plugin.dll \
            VLC_CFLAGS="-I/ucrt64/include -I/ucrt64/include/vlc/plugins -D__PLUGIN__ -D_FILE_OFFSET_BITS=64 -D_REENTRANT -D_THREAD_SAFE" \
            VLC_LIBS="$PWD/vlc-3.0.21/libvlccore.dll.a" \
            CURL_CFLAGS="-I/mingw32/include" \
            CURL_LIBS="-L/mingw32/lib -lcurl"
          file libjellyfin_plugin.dll || true
      - uses: actions/upload-artifact@v4
        with:
          name: libjellyfin_plugin-windows-x86
          path: libjellyfin_plugin.dll
          if-no-files-found: error
